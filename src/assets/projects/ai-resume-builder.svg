<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="r-amb" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#5B76FF" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#5B76FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="r-sheet" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FBFAF7"/>
      <stop offset="0.55" stop-color="#E4E2DA"/>
      <stop offset="1" stop-color="#B9B7AF"/>
    </linearGradient>
    <linearGradient id="r-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E8C85"/>
      <stop offset="1" stop-color="#64635E"/>
    </linearGradient>
    <linearGradient id="r-prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9B8FF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#5B76FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#F2F1ED" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="r-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F1ED" stop-opacity="0"/>
      <stop offset="1" stop-color="#F2F1ED" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="r-plinth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232733"/>
      <stop offset="1" stop-color="#14171F"/>
    </linearGradient>
    <filter id="r-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="r-blur-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0B0D12"/>
  <rect width="1600" height="900" fill="url(#r-amb)"/>

  <ellipse cx="700" cy="706" rx="290" ry="30" fill="#000" opacity="0.55" filter="url(#r-soft)"/>

  <!-- ── the resume: a tilted sheet with real thickness ── -->
  <g transform="translate(408 168) rotate(-7)">
    <rect x="10" y="10" width="330" height="452" rx="12" fill="#000" opacity="0.5" filter="url(#r-blur-sm)"/>
    <path d="M330 8 L344 22 L344 466 L330 452 Z" fill="url(#r-edge)"/>
    <rect width="330" height="452" rx="10" fill="url(#r-sheet)"/>
    <rect x="1" y="1" width="328" height="450" rx="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.5"/>

    <!-- content abstracted to bars — nothing readable -->
    <rect x="40" y="52" width="132" height="17" rx="8" fill="#14161C" opacity="0.82"/>
    <rect x="40" y="80" width="86" height="9" rx="4" fill="#14161C" opacity="0.32"/>
    <rect x="40" y="130" width="60" height="8" rx="4" fill="#5B76FF"/>
    <g fill="#14161C" opacity="0.2">
      <rect x="40" y="156" width="250" height="8" rx="4"/>
      <rect x="40" y="176" width="224" height="8" rx="4"/>
      <rect x="40" y="196" width="243" height="8" rx="4"/>
    </g>
    <rect x="40" y="240" width="60" height="8" rx="4" fill="#5B76FF"/>
    <g fill="#14161C" opacity="0.2">
      <rect x="40" y="266" width="250" height="8" rx="4"/>
      <rect x="40" y="286" width="196" height="8" rx="4"/>
      <rect x="40" y="306" width="238" height="8" rx="4"/>
      <rect x="40" y="326" width="150" height="8" rx="4"/>
    </g>
    <g fill="#14161C" opacity="0.1">
      <rect x="40" y="374" width="66" height="24" rx="12"/>
      <rect x="116" y="374" width="88" height="24" rx="12"/>
      <rect x="214" y="374" width="58" height="24" rx="12"/>
    </g>
  </g>

  <!-- beam entering the prism -->
  <path d="M760 392 L880 392 L880 408 L760 408 Z" fill="url(#r-beam)" opacity="0.8"/>

  <!-- ── the prism: the analysis step ── -->
  <g transform="translate(880 250)">
    <path d="M110 0 L220 300 L0 300 Z" fill="url(#r-prism)"/>
    <path d="M110 0 L220 300 L0 300 Z" fill="none" stroke="#A9B8FF" stroke-opacity="0.75" stroke-width="2.5"/>
    <path d="M110 0 L150 300 L0 300 Z" fill="#F2F1ED" opacity="0.06"/>
    <path d="M110 6 L206 292" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="110" cy="318" rx="118" ry="14" fill="#5B76FF" opacity="0.2" filter="url(#r-blur-sm)"/>
  </g>

  <!-- ── refracted output: the match profile ── -->
  <g transform="translate(1116 372)">
    <rect x="0" y="-66" width="280" height="14" rx="7" fill="#A9B8FF" opacity="0.95"/>
    <rect x="0" y="-32" width="222" height="14" rx="7" fill="#5B76FF"/>
    <rect x="0" y="2" width="264" height="14" rx="7" fill="#5B76FF" opacity="0.72"/>
    <rect x="0" y="36" width="160" height="14" rx="7" fill="#F2F1ED" opacity="0.4"/>
    <rect x="0" y="70" width="206" height="14" rx="7" fill="#5B76FF" opacity="0.45"/>
    <g opacity="0.5">
      <path d="M-86 -26 L0 -59" stroke="#A9B8FF" stroke-width="2" fill="none"/>
      <path d="M-86 -16 L0 -25" stroke="#5B76FF" stroke-width="2" fill="none"/>
      <path d="M-86 -6 L0 9" stroke="#5B76FF" stroke-width="2" fill="none"/>
      <path d="M-86 4 L0 43" stroke="#F2F1ED" stroke-opacity="0.5" stroke-width="2" fill="none"/>
      <path d="M-86 14 L0 77" stroke="#5B76FF" stroke-width="2" fill="none"/>
    </g>
  </g>

  <ellipse cx="1180" cy="720" rx="230" ry="20" fill="#5B76FF" opacity="0.14" filter="url(#r-soft)"/>
</svg>
