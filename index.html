<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D12" />

    <!--
      ─────────────────────────────────────────────────────────────
      STILL TO REPLACE BEFORE DEPLOY
      1. https://your-domain.example → your real domain (canonical + OG urls + sitemap.xml + robots.txt)
      2. /og-cover.png               → export a 1200x630 social image into /public
      ─────────────────────────────────────────────────────────────
    -->
    <title>Harshit Gupta — Software Developer | Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of a software developer specializing in React.js, Node.js, Express.js, MongoDB, SQL and modern web development."
    />
    <link rel="canonical" href="https://your-domain.example/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Harshit Gupta" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harshit Gupta — Software Developer" />
    <meta property="og:title" content="Harshit Gupta — Software Developer | Full Stack Developer" />
    <meta
      property="og:description"
      content="Portfolio of a software developer specializing in React.js, Node.js, Express.js, MongoDB, SQL and modern web development."
    />
    <meta property="og:url" content="https://your-domain.example/" />
    <meta property="og:image" content="https://your-domain.example/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portfolio of a full stack software developer." />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harshit Gupta — Software Developer | Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of a software developer specializing in React.js, Node.js, Express.js, MongoDB, SQL and modern web development."
    />
    <meta name="twitter:image" content="https://your-domain.example/og-cover.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <!-- Structured data: who this site is about. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Harshit Gupta",
        "url": "https://your-domain.example/",
        "jobTitle": "Software Developer",
        "description": "Full stack software developer building web applications with React.js, Node.js, Express.js, MongoDB and SQL.",
        "hasOccupation": {
          "@type": "Occupation",
          "name": "Software Developer",
          "occupationalCategory": "15-1252.00",
          "skills": "React.js, Node.js, Express.js, MongoDB, PostgreSQL, SQL, REST APIs, Git, Docker"
        },
        "sameAs": [
          "https://www.linkedin.com/in/harshitgupta26/",
          "https://github.com/harshitgupta2"
        ],
        "knowsAbout": [
          "React.js",
          "Node.js",
          "Express.js",
          "MongoDB",
          "PostgreSQL",
          "REST APIs",
          "Web Performance"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
